<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Contact page | StyloftCSS example</title><link rel="stylesheet" href="../styloft.min.css"></head><body><a href="#main" class="sl-skip sl-btn">Skip to content</a><header class="sl-container sl-py-6"><a href="landing.html">North studio</a></header><main id="main" class="sl-container sl-py-12 sl-stack sl-gap-6"><h1 class="sl-text-xl">Start a conversation.</h1><p>This is a static form template. Connect your own submission endpoint; the preview does not send data.</p><form class="sl-card sl-stack sl-gap-6" action="#main" method="get"><label class="sl-field"><span class="sl-label">Name</span><input class="sl-input" name="name" autocomplete="name" required></label><label class="sl-field"><span class="sl-label">Email</span><input class="sl-input" name="email" type="email" autocomplete="email" required></label><label class="sl-field"><span class="sl-label">Message</span><textarea class="sl-input" name="message" rows="5" required></textarea></label><p>The submit button is inactive until you connect a backend.</p><button class="sl-btn" type="submit" disabled>Send message</button></form></main></body></html>
